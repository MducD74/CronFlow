spring:
  application:
    name: CronFlow
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: JDBC:mysql://localhost:3306/cronflow
    username: root
    password: admin
  jpa:
    hibernate.ddl-auto: validate
    generate-ddl: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    